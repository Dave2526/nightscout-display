[platformio]
default_envs = tdisplay-s3

[env:tdisplay-s3]
platform = espressif32@6.10.0
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
extra_scripts = pre:git_version.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOTA_PASS=\"${sysenv.NS_OTA_PASS}\"
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.4.2
    tzapu/WiFiManager@^2.0.17
    bertmelis/espMqttClient@^1.7.0

; Updates per WLAN: NS_HOST=<hostname-oder-ip> pio run -e ota -t upload
[env:ota]
extends = env:tdisplay-s3
upload_protocol = espota
upload_port = ${sysenv.NS_HOST}
upload_flags = --auth=${sysenv.NS_OTA_PASS}
